[Unit]
# no-uwsm: Hyprland starts after default.target and imports its instance env
# into the manager only mid-startup, so the daemon must NOT rely on inherited
# env. The wrapper derives HYPRLAND_INSTANCE_SIGNATURE/WAYLAND_DISPLAY at
# exec time from the socket dir instead.
After=default.target
StartLimitIntervalSec=600
StartLimitBurst=30

[Service]
ExecStart=
ExecStart=/home/spix/.config/systemd/user/libinput-gestures-start.sh
# `always`: the wrapper exits 0 when the compositor restarts so it comes
# back with fresh HYPRLAND_INSTANCE_SIGNATURE (explicit stop is honored).
Restart=always
RestartSec=5
